```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Anniversary</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="pin-page">

  <!-- background decoration -->
  <div class="floating-heart heart-1">♡</div>
  <div class="floating-heart heart-2">♡</div>
  <div class="floating-heart heart-3">♡</div>
  <div class="floating-heart heart-4">♡</div>

  <main class="pin-container">

    <section class="pin-card">

      <!-- top decoration -->
      <div class="tiny-line">
        <span></span>
        <i>♡</i>
        <span></span>
      </div>

      <p class="eyebrow">
        OUR LITTLE WORLD
      </p>

      <h1>
        Enter PIN
        <span>♡</span>
      </h1>

      <p class="subtitle">
        ใส่รหัสของเรา<br>
        แล้วไปเปิดความทรงจำกัน
      </p>

      <!-- PIN -->
      <div class="pin-dots" id="pinDots">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- keypad -->
      <div class="keypad">

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>

        <button class="text-key" id="clearBtn">
          CLEAR
        </button>

        <button class="key" data-number="0">
          0
        </button>

        <button class="text-key delete" id="deleteBtn">
          ⌫
        </button>

      </div>

      <p class="hint">
        our special date · 6 digits
      </p>

      <p id="errorMessage"></p>

    </section>

    <p class="bottom-note">
      made with ♡ for someone special
    </p>

  </main>

  <script src="script.js"></script>

</body>
</html>
