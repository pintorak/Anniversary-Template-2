<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Story ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Kanit", sans-serif;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.75) 2px, transparent 2.5px),
        #ffbdc5;
      background-size: 26px 26px;

      color: #670626;
      overflow-x: hidden;
    }

    body::before {
      content: "♡";
      position: fixed;
      top: 8%;
      left: 8%;
      font-size: 18px;
      color: rgba(103, 6, 38, 0.18);
      z-index: 0;
    }

    body::after {
      content: "♡";
      position: fixed;
      bottom: 10%;
      right: 9%;
      font-size: 24px;
      color: rgba(103, 6, 38, 0.15);
      z-index: 0;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 42px 20px 55px;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 34px;
    }

    .chapter {
      font-size: 11px;
      letter-spacing: 4px;
      font-weight: 500;
      color: #670626;
      margin-bottom: 8px;
    }

    .title {
      font-family: "Itim", cursive;
      font-size: 48px;
      line-height: 1;
      color: #670626;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 300;
      color: rgba(103, 6, 38, 0.7);
      letter-spacing: 1px;
    }

    .story-area {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(250px, 1fr));
      gap: 55px 45px;
      padding: 15px 10px 30px;
      perspective: 1500px;
    }

    .polaroid {
      width: 100%;
      max-width: 300px;
      height: 385px;
      margin: 0 auto;
      cursor: pointer;
      perspective: 1200px;
    }

    .polaroid:nth-child(1) {
      transform: rotate(-5deg);
    }

    .polaroid:nth-child(2) {
      transform: rotate(4deg);
    }

    .polaroid:nth-child(3) {
      transform: rotate(3deg);
    }

    .polaroid:nth-child(4) {
      transform: rotate(-4deg);
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.2, 0.75, 0.2, 1);
    }

    .polaroid.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      background: #fff9f8;
      border-radius: 4px;
      padding: 14px 14px 25px;

      box-shadow:
        0 18px 35px rgba(103, 6, 38, 0.16),
        0 4px 10px rgba(103, 6, 38, 0.08);

      display: flex;
      flex-direction: column;
    }

    .photo {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      background: #fdecef;
    }

    .caption {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Itim", cursive;
      font-size: 23px;
      color: #670626;
      text-align: center;
      padding-top: 8px;
    }

    .tap {
      position: absolute;
      bottom: 7px;
      right: 13px;

      font-size: 9px;
      letter-spacing: 1px;
      color: rgba(103, 6, 38, 0.38);
    }

    .card-back {
      transform: rotateY(180deg);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .back-heart {
      font-family: "Itim", cursive;
      font-size: 42px;
      color: #670626;
      margin-bottom: 18px;
    }

    .back-title {
      font-family: "Itim", cursive;
      font-size: 27px;
      color: #670626;
      margin-bottom: 14px;
    }

    .back-text {
      font-size: 14px;
      line-height: 2;
      font-weight: 300;
      color: rgba(103, 6, 38, 0.78);
      white-space: pre-line;
    }

    .hint {
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      color: rgba
