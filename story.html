@import url('https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle, rgba(103,6,38,.10) 1.5px, transparent 1.5px),
    #FFBDC5;
  background-size: 24px 24px;
  font-family: 'Kanit', sans-serif;
  color: #670626;
  overflow-x: hidden;
}

/* ===== TOP ===== */

.page {
  min-height: 100vh;
  padding: 55px 20px 80px;
  position: relative;
}

.header {
  text-align: center;
  margin-bottom: 45px;
}

.chapter {
  font-size: 11px;
  letter-spacing: 4px;
  font-weight: 500;
  margin-bottom: 12px;
  opacity: .65;
}

.title {
  font-family: 'Itim', cursive;
  font-size: clamp(42px, 12vw, 72px);
  line-height: .9;
  color: #670626;
}

.subtitle {
  margin-top: 14px;
  font-size: 12px;
  color: #670626;
  opacity: .65;
}

/* ===== POLAROID AREA ===== */

.polaroid-area {
  width: min(100%, 520px);
  margin: auto;
  position: relative;
  min-height: 760px;
}

/* ===== CARD ===== */

.polaroid {
  position: absolute;
  width: 235px;
  height: 305px;
  perspective: 1000px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .75s cubic-bezier(.2,.8,.2,1);
}

.polaroid.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;

  background: #FFF9F8;
  border-radius: 3px;
  padding: 11px 11px 28px;

  box-shadow:
    0 15px 35px rgba(103,6,38,.20),
    0 4px 10px rgba(103,6,38,.10);
}

/* รูปด้านหน้า */

.card-front {
  display: flex;
  flex-direction: column;
}

.photo {
  width: 100%;
  height: 225px;
  background: #FDECEF;
  overflow: hidden;
  position: relative;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.photo-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #670626;
  opacity: .35;
  font-size: 13px;
  text-align: center;
  padding: 20px;
}

.photo-number {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: rgba(255,255,255,.88);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #670626;
  font-size: 11px;
}

.tap {
  position: absolute;
  right: -3px;
  bottom: 72px;
  background: #FF8FA0;
  color: white;
  font-size: 10px;
  padding: 5px 12px;
  border-radius: 20px;
  letter-spacing: .5px;
  box-shadow: 0 4px 10px rgba(103,6,38,.15);
}

.polaroid-caption {
  text-align: center;
  font-family: 'Itim', cursive;
  font-size: 18px;
  margin-top: 8px;
  color: #670626;
}

  transform: rotateY(180deg);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
