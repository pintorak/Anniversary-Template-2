<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Story ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle, rgba(103, 6, 38, 0.10) 1.5px, transparent 1.5px),
    #FFBDC5;
  background-size: 24px 24px;
  font-family: 'Kanit', sans-serif;
  color: #670626;
  overflow-x: hidden;
}

.page {
  min-height: 100vh;
  padding: 45px 20px 70px;
}

.header {
  text-align: center;
  margin-bottom: 35px;
}

.chapter {
  font-size: 10px;
  letter-spacing: 4px;
  opacity: 0.6;
  margin-bottom: 10px;
}

.title {
  font-family: 'Itim', cursive;
  font-size: clamp(45px, 13vw, 72px);
  line-height: 0.9;
  color: #670626;
}

.subtitle {
  margin-top: 14px;
  font-size: 11px;
  opacity: 0.65;
}

/* POLAROID AREA */

.polaroid-area {
  width: min(100%, 520px);
  min-height: 780px;
  margin: 0 auto;
  position: relative;
}

/* CARD */

.polaroid {
  width: 235px;
  height: 310px;
  position: absolute;
  perspective: 1200px;
  cursor: pointer;
}

.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition:
    transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.polaroid.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front,
.card-back {
  position: absolute;
  inset: 0;

  background: #FFF9F8;

  border-radius: 4px;

  box-shadow:
    0 15px 35px rgba(103, 6, 38, 0.20),
    0 4px 10px rgba(103, 6, 38, 0.10);

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* FRONT */

.card-front {
  padding: 11px;
  padding-bottom: 27px;
}

.photo {
  width: 100%;
  height: 228px;
  overflow: hidden;
  background: #FDECEF;
  position: relative;
}

.photo img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.photo-number {
  position: absolute;
  top: 9px;
  right: 9px;

  width: 27px;
  height: 27px;

  border-radius: 50%;

  background: rgba(255,255,255,0.9);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 10px;
}

.caption {
  text-align: center;
  font-family: 'Itim', cursive;
  font-size: 19px;
  margin-top: 8px;
}

.tap {
  position: absolute;
  right: -5px;
  bottom: 67px;

  background: #670626;
  color: #fff;

  padding: 5px 12px;

  border-radius: 20px;

  font-size: 9px;
  letter-spacing: 0.5px;

  box-shadow: 0 5px 12px rgba(103,6,38,0.18);
}

/* BACK */

.card-back {
  transform: rotateY(180deg);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 28px 22px;

  background:
    linear-gradient(
      145deg,
      #FFF9F8 0%,
      #FDECEF 100%
    );
}

.back-heart {
  font-size: 28px;
  margin-bottom: 12px;
}

.back-label {
  font-size: 9px;
  letter-spacing: 3px;
  opacity: 0.45;
  margin-bottom: 13px;
}

.back-text {
  font-family: 'Itim', cursive;
  font-size: 23px;
  line-height: 1.35;
}

.back-small {
  margin-top: 18px;
  font-size: 10px;
  line-height: 1.7;
  opacity: 0.55;
}

/* POSITIONS */

.card-1 {
  top: 0;
  left: 8px;
  transform: rotate(-7deg);
  z-index: 2;
}

.card-2 {
  top: 145px;
  right: 0;
  transform: rotate(8deg);
  z-index: 4;
}

.card-3 {
  top: 315px;
  left: 25px;
  transform: rotate(-4deg);
  z-index: 3;
}

.card-4 {
  top: 475px;
  right: 8px;
  transform: rotate(6deg);
  z-index: 5;
}

/* FLOATING HEARTS */

.heart {
  position: fixed;
  color: #670626;
  opacity: 0.25;
  pointer-events: none;
  animation: floating 5s ease-in-out infinite;
}

.heart:nth-child(1) {
  top: 14%;
  left: 8%;
  font-size: 16px;
}

.heart:nth-child(2) {
  top: 30%;
  right: 8%;
  font-size: 13px;
  animation-delay: 1s;
}

.heart:nth-child(3) {
  bottom: 17%;
  left: 12%;
  font-size: 11px;
  animation-delay: 2s;
}

.heart:nth-child(4) {
  bottom: 8%;
  right: 15%;
  font-size: 17px;
  animation-delay: 1.5s;
}

@keyframes floating {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-12px);
  }
}

/* BUTTON */

.bottom {
  text-align: center;
  margin-top: 0;
}

.next-btn {
  display: inline-block;

  background: #670626;
  color: #fff;

  text-decoration: none;

  padding: 13px 27px;

  border-radius: 999px;

  font-size: 10px;
  letter-spacing: 2px;

  box-shadow:
    0 9px 20px rgba(103,6,38,0.18);

  transition: 0.25s;
}

.next-btn:hover {
  transform: translateY(-3px);
}

.footer {
  margin-top: 16px;
  font-size: 10px;
  opacity: 0.45;
  letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 520px) {

  .page {
    padding: 40px 14px 60px;
  }

  .polaroid-area {
    min-height: 700px;
  }

  .polaroid {
    width: 190px;
    height: 255px;
  }

  .photo {
    height: 185px;
  }

  .caption {
    font-size: 16px;
    margin-top: 6px;
  }

  .tap {
    bottom: 58px;
    font-size: 8px;
    padding: 4px 10px;
  }

  .back-text {
    font-size: 19px;
  }

  .back-small {
    font-size: 9px;
  }

  .card-1 {
    left: 0;
  }

  .card-2 {
    right: -2px;
    top: 125px;
  }

  .card-3 {
    left: 8px;
    top: 285px;
  }

  .card-4 {
    right: 0;
    top: 435px;
  }
}
</style>
</head>

<body>

<div class="heart">♡</div>
<div class="heart">♡</div>
<div class="heart">♡</div>
<div class="heart">♡</div>

<main class="page">

  <div class="header">

    <div class="chapter">
      CHAPTER 01
    </div>

    <h1 class="title">
      Our Story ♡
    </h1>

    <p class="subtitle">
      tap each photo to turn it over
    </p>

  </div>


  <section class="polaroid-area">

    <!-- POLAROID 01 -->

    <div class="polaroid card-1" onclick="flipCard(this)">

      <div class="card-inner">

        <div class="card-front">
