:root {
  --claret: #670626;
  --pink: #FFBDC5;
  --cream: #FFF9F8;
  --soft: #FDECEF;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  background-color: var(--pink);

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.55) 1.4px,
      transparent 1.5px
    );

  background-size: 34px 34px;

  color: var(--claret);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 24px 16px;
}

.page {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

.chapter {
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 4px;
  opacity: .7;
  margin-bottom: 11px;
}

h1 {
  margin: 0;
  font-size: clamp(32px, 9vw, 48px);
  line-height: .98;
  font-weight: 600;
}

.subtitle {
  margin: 12px 0 25px;

  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 1.6px;

  opacity: .6;
}

/* MAIN CARD */

.card {
  width: 100%;

  background: var(--cream);

  border-radius: 28px;

  padding: 28px 22px 25px;

  box-shadow:
    0 20px 50px rgba(103,6,38,.18);

  border: 1px solid rgba(103,6,38,.08);
}

/* CASSETTE */

.cassette-area {
  width: 100%;
  display: flex;
  justify-content: center;

  padding: 5px 0 25px;
}

.cassette {
  position: relative;

  width: 330px;
  max-width: 100%;

  aspect-ratio: 1.68 / 1;

  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      #7c173b 0%,
      #670626 48%,
      #50051d 100%
    );

    0 16px 30px rgba(103,6,38,.3),
    inset 0 2px 0 rgba(255,255,255,.16),
    inset 0 -8px 15px rgba(0,0,0,.14);

  transform: rotate(-1.5deg);

  transition:
    transform .3s ease,
    box-shadow .3s ease;
}
