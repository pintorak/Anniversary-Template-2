<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Song ♡</title>

  <style>
    :root {
      --claret: #670626;
      --pink: #FFBDC5;
      --cream: #FFF9F8;
      --soft: #FDECEF;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      color: var(--claret);

      background-color: var(--pink);

      background-image:
        radial-gradient(
          rgba(255,255,255,.62) 1.4px,
          transparent 1.4px
        );

      background-size: 34px 34px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 28px 18px;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100%, 520px);
      text-align: center;
      position: relative;
    }

    .chapter {
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 10px;
      opacity: .68;
    }

    h1 {
      font-size: clamp(31px, 9vw, 48px);
      line-height: .98;
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 1.8px;
      text-transform: lowercase;
      opacity: .58;
      margin-bottom: 26px;
    }

    /* CARD */

    .main-card {
      width: 100%;
      background: rgba(255,249,248,.97);
      border-radius: 30px;
      padding: 30px 25px 25px;
      box-shadow:
        0 20px 55px rgba(103,6,38,.18);
      border: 1px solid rgba(103,6,38,.08);
    }

    /* CASSETTE */

    .cassette-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 5px 0 27px;
    }

      width: min(340px, 100%);
      aspect-ratio: 1.7 / 1;
      position: relative;

      border-radius: 15px;

      background:
