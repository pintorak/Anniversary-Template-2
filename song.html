<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Song That Feels Like Us ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #670626;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,.55) 1.5px,
          transparent 1.5px
        ),
        #FFBDC5;

      background-size: 34px 34px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 520px;
      text-align: center;
      position: relative;
    }

    .chapter {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      font-weight: bold;
      opacity: .75;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(30px, 8vw, 46px);
      line-height: 1;
      margin-bottom: 10px;
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 1.4px;
      opacity: .7;
      margin-bottom: 27px;
    }

    .music-card {
      width: 100%;
      background: rgba(255, 249, 248, .96);
      border-radius: 30px;

      padding: 28px 24px 25px;

      box-shadow:
        0 20px 50px rgba(103, 6, 38, .18);

      border: 1px solid rgba(103, 6, 38, .08);
    }

    /* CASSETTE */

    .cassette-area {
      display: flex;
      justify-content: center;
      margin: 4px 0 25px;
    }

    .cassette {
      width: 315px;
      max-width: 100%;
      height: 190px;

      position: relative;

      background:
        linear-gradient(
          135deg,
          #7d183c 0%,
          #670626 45%,
          #52051e 100%
        );

      border-radius: 17px;

      box-shadow:
        0 16px 28px rgba(103, 6, 38, .32),
        inset 0 2px 0 rgba(255,255,255,.18),
        inset 0 -5px 10px rgba(0,0,0,.18);

      border: 3px solid #4d061d;

      transform: rotate(-2deg);

      transition: transform .35s ease;
    }

    .cassette.playing {
      transform: rotate(0deg) translateY(-3px);
    }

    /* top shine */

    .cassette::before {
      content: "";
      position: absolute;

      left: 16px;
      right: 16px;
      top: 12px;

      height: 3px;

      background: rgba(255,255,255,.25);
      border-radius: 10px;
    }

    /* label */

    .label {
      position: absolute;

      left: 27px;
      right: 27px;
      top: 30px;

      height: 83px;

      background: #FFF9F8;

      border-radius: 5px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: #670626;

      box-shadow:
        inset 0 0 0 1px rgba(103,6,38,.1);
    }

    .label-title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .label-small {
      margin-top: 6px;

      font-family: Arial, sans-serif;
      font-size: 8px;
      letter-spacing: 3px;

      opacity: .6;
    }

    .label-line {
      width: 100px;
      height: 2px;

      background: #FFBDC5;

      margin-top: 9px;
    }

    /* tape window */

    .tape-window {
      position: absolute;

      left: 75px;
      right: 75px;
      bottom: 25px;

      height: 40px;

      background: #FDECEF;

      border-radius: 7px;

      border: 3px solid #4d061d;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 12px;
    }

    .reel {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      background:
        repeating-conic-gradient(
          from 0deg,
          #670626 0deg 12deg,
          #FFBDC5 12deg 24deg
        );

      border: 3px solid #670626;

      position: relative;

      transition: transform .5s linear;
    }

    .reel::after {
      content: "";

      position: absolute;

      width: 9px;
      height: 9px;

      background: #FFF9F8;
