<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Put Us Together ♡</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  background-color: #FFBDC5;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,0.58) 1.5px,
      transparent 1.5px
    );

  background-size: 34px 34px;

  color: #670626;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  display: flex;
  justify-content: center;

  padding: 42px 18px 55px;

  position: relative;
}

/* soft background circles */

body::before {
  content: "";
  position: fixed;

  width: 330px;
  height: 330px;

  border-radius: 50%;

  background: rgba(255,249,248,0.15);

  top: -160px;
  right: -130px;

  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;

  width: 300px;
  height: 300px;

  border-radius: 50%;

  background: rgba(255,249,248,0.12);

  bottom: -150px;
  left: -130px;

  pointer-events: none;
}

/* floating hearts */

.floating-heart {
  position: fixed;

  color: rgba(103,6,38,0.25);

  font-size: 17px;

  z-index: 0;

  pointer-events: none;

  animation: floating 5s ease-in-out infinite;
}

.heart-1 {
  top: 13%;
  left: 9%;
}

.heart-2 {
  top: 26%;
  right: 8%;

  animation-delay: 1.3s;
}

.heart-3 {
  bottom: 19%;
  left: 11%;

  animation-delay: 2s;
}

.heart-4 {
  bottom: 10%;
  right: 12%;

  animation-delay: 3s;
}

@keyframes floating {

  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }

}

/* main */

.page {
  width: 100%;
  max-width: 520px;

  position: relative;

  z-index: 2;

  text-align: center;
}

/* heading */

.chapter {
  font-size: 10px;

  letter-spacing: 4px;

  margin-bottom: 14px;

  opacity: 0.7;
}

.title {
  font-size: clamp(34px, 10vw, 50px);

  font-weight: 400;

  font-style: italic;

  line-height: 1.05;

  margin-bottom: 12px;
}

.subtitle {
  font-size: 11px;

  letter-spacing: 1.8px;

  opacity: 0.6;

  margin-bottom: 28px;
}

/* card */

.puzzle-card {
  width: 100%;

  background: rgba(255,249,248,0.93);

  border: 1px solid rgba(103,6,38,0.09);

  border-radius: 30px;

  padding: 27px 20px 28px;

  box-shadow:
    0 22px 60px rgba(103,6,38,0.13),
    0 5px 20px rgba(103,6,38,0.06);
}

.instruction {
  font-size: 11px;

  line-height: 1.9;

  letter-spacing: 0.5px;

  opacity: 0.62;

  margin-bottom: 20px;
}

/* puzzle */

.puzzle {
  width: min(82vw, 330px);

  aspect-ratio: 1 / 1;

  margin: 0 auto 18px;

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 5px;

  padding: 5px;

  background: #670626;

  border-radius: 17px;

  box-shadow:
    0 12px 35px rgba(103,6,38,0.18);

  overflow: hidden;
}

.tile {
  position: relative;

  width: 100%;
  height: 100%;

  min-width: 0;

  min-height: 0;

  overflow: hidden;

  border-radius: 10px;

  background: #f7e3e7;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    opacity 0.15s ease;
}

.tile:hover {
  transform: scale(0.98);
}

.tile.empty {
  background:
    linear-gradient(
      135deg,
      rgba(103,6,38,0.08),
      rgba(103,6,38,0.025)
    );

  cursor: default;
}

.tile.empty:hover {
  transform: none;
}

/*
  รูปต้นฉบับเป็นรูป story-01.jpg
  แต่ละช่องจะแสดงคนละส่วนของรูป
*/

.tile-image {
  position: absolute;

  width: 300%;
  height: 300%;

  max-width: none;

  object-fit: cover;

  pointer-events: none;
}

/* positions */

.pos-0 {
  left: 0;
  top: 0;
}

.pos-1 {
  left: -100%;
  top: 0;
}

.pos-2 {
  left: -200%;
  top: 0;
}

.pos-3 {
  left: 0;
  top: -100%;
}

.pos-4 {
  left: -100%;
  top: -100%;
}

.pos-5 {
  left: -200%;
  top: -100%;
}

.pos-6 {
  left: 0;
  top: -200%;
}

.pos-7 {
  left: -100%;
  top: -200%;
}

/* moves */

.moves {
  font-size: 9px;

  letter-spacing: 3px;

  opacity: 0.5;

  margin-bottom: 18px;
}

.moves span {
  font-size: 13px;

  font-weight: bold;

  color: #670626;
}

/* buttons */

.buttons {
  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 10px;
}

.shuffle-btn {
  border: 0;

  background: transparent;

  color: #670626;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 10px;

  letter-spacing: 2px;

  padding: 8px 16px;

  cursor: pointer;

  transition: 0.25s ease;
}

.shuffle-btn:hover {
  opacity: 0.6;

  transform: translateY(-1px);
}

/* GIVE UP */

.give-up-btn {
  display: inline-flex;

  align-items: center;

  justify-content: center;

  min-width: 145px;

  min-height: 40px
