<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Put Us Together ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #ffbdc5;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.65) 1.4px, transparent 1.4px);
      background-size: 34px 34px;
      color: #670626;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
      position: relative;
    }

    /* soft pink glow */
    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 249, 248, 0.20);
      top: -180px;
      right: -150px;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: rgba(255, 249, 248, 0.14);
      bottom: -180px;
      left: -150px;
      pointer-events: none;
    }

    .page {
      width: 100%;
      max-width: 540px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    /* floating hearts */

    .heart {
      position: fixed;
      color: rgba(103, 6, 38, 0.25);
      font-size: 17px;
      animation: float 5s ease-in-out infinite;
      pointer-events: none;
    }

    .heart.h1 {
      top: 12%;
      left: 9%;
    }

    .heart.h2 {
      top: 23%;
      right: 9%;
      animation-delay: 1.5s;
    }

    .heart.h3 {
      bottom: 17%;
      left: 12%;
      animation-delay: 2.5s;
    }

    .heart.h4 {
      bottom: 11%;
      right: 12%;
      animation-delay: 1s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    /* heading */

    .chapter {
      font-size: 10px;
      letter-spacing: 4px;
      margin-bottom: 15px;
      opacity: 0.75;
    }

    h1 {
      font-size: clamp(34px, 9vw, 48px);
      font-weight: 400;
      font-style: italic;
      line-height: 1;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 1.5px;
      opacity: 0.65;
      margin-bottom: 28px;
    }

    /* puzzle card */

    .puzzle
