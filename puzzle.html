<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Put Us Together ♡</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    #ffbdc5
    radial-gradient(
      circle,
      rgba(255,255,255,0.65) 1.5px,
      transparent 1.5px
    );
  background-size: 34px 34px;

  color: #670626;
  font-family: Georgia, "Times New Roman", serif;

  display: flex;
  justify-content: center;

  padding: 35px 16px 50px;

  overflow-x: hidden;
}

.page {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

.chapter {
  font-size: 10px;
  letter-spacing: 4px;
  opacity: 0.7;
  margin-bottom: 14px;
}

.title {
  font-size: clamp(34px, 10vw, 48px);
  font-weight: normal;
  font-style: italic;
  line-height: 1.1;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 11px;
  letter-spacing: 1.5px;
  opacity: 0.6;
  margin-bottom: 28px;
}

.card {
  background: rgba(255,249,248,0.95);
  border-radius: 28px;
  padding: 25px 18px 28px;

  box-shadow:
    0 20px 55px rgba(103,6,38,0.14);

  border: 1px solid rgba(103,6,38,0.08);
}

.instruction {
  font-size: 11px;
  line-height: 1.8;
  opacity: 0.65;
  margin-bottom: 18px;
}

/* PUZZLE */

.puzzle {
  width: min(82vw, 330px);
  aspect-ratio: 1 / 1;

  margin: 0 auto 18px;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;

  padding: 5px;

  background: #670626;

  border-radius: 16px;

  box-shadow:
    0 12px 30px rgba(103,6,38,0.18);
}

.tile {
  position: relative;

  width: 100%;
  aspect-ratio: 1 / 1;

  overflow: hidden;

  border-radius: 9px;

  background: #f6e3e6;

  cursor: pointer;
}

.tile:hover {
  transform: scale(0.98);
}

.empty {
  background:
    rgba(103,6,38,0.08);
  cursor: default;
}

.empty:hover {
  transform: none;
}

.tile img {
  position: absolute;

  width: 300%;
  height: 300%;

  max-width: none;

  pointer-events: none;
}

/* รูปแต่ละช่อง */

.part0 {
  left: 0;
  top: 0;
}

.part1 {
  left: -100%;
  top: 0;
}

.part2 {
  left: -200%;
  top: 0;
}

.part3 {
  left: 0;
  top: -100%;
}

.part4 {
  left: -100%;
  top: -100%;
}

.part5 {
  left: -200%;
  top: -100%;
}

.part6 {
  left: 0;
  top: -200%;
}

.part7 {
  left: -100%;
  top: -200%;
}

/* MOVE */

.moves {
  font-size: 9px;
  letter-spacing: 3px;
  opacity: 0.5;
  margin-bottom: 17px;
}

.moves span {
  color: #670626;
  font-size: 13px;
  font-weight: bold;
}

/* BUTTONS */

.buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
}

.shuffle {
  border: 0;
  background: transparent;

  color: #670626;

  font-family: Georgia, "Times New Roman", serif;

  font-size: 10px;
  letter-spacing: 2px;

  padding: 8px 18px;

  cursor: pointer;
}

.shuffle:hover {
  opacity: 0.6;
}

/* ยอมแพ้ */

.give-up {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 145px;

  padding: 11px 24px;

  border: 1px solid rgba(103,6,38,0.25);

  border-radius: 999px;

  background: rgba(255,255,255,0.6);

  color: #670626;

  text-decoration: none;

  font-size: 10px;
  letter-spacing: 2px;

  transition: 0.25s ease;
}

.give-up:hover {
  background: #670626;
  color: #fff9f8;

  transform: translateY(-2px);
}

/* SUCCESS */

.success {
  display: none;
  margin-top: 20px;
}

.success.show {
  display: block;
}

.success-heart {
  font-size: 40px;
  margin-bottom: 8px;
}

.success-title {
  font-size: 28px;
  font-style: italic;
  margin-bottom: 8px;
}

.success-text {
  font-size: 11px;
  line-height: 1.8;
  opacity: 0.65;
  margin-bottom: 18px;
}

.continue {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 12px 25px;

  background: #670626;
  color: #fff9f8;

  border-radius: 999px;

  text-decoration: none;

  font-size: 10px;
  letter-spacing: 2px;

  transition: 0.25s ease;
}

.continue:hover {
  transform: translateY(-2px);
}

/* MOBILE */

@media (max-width: 480px) {
  .title {
    font-size: 36px;
  }

  .card {
    padding-left: 14px;
    padding-right: 14px;
  }

  .puzzle {
    width: min(84vw, 315px);
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="chapter">
    CHAPTER 03
  </div>

  <h1 class="title">
    Put Us Together ♡
  </h1>

  <div class="subtitle">
    some things are meant to fit together
  </div>

  <div class="card">

    <p class="instruction">
      ขยับรูปทีละช่อง<br>
      แล้วลองต่อ
